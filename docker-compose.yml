services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER:-ai_trading_lab}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in EasyPanel}@postgres:5432/${POSTGRES_DB:-ai_trading_lab}
      PGSSL: "false"
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-}
      N8N_ANALYZE_WEBHOOK_URL: ${N8N_ANALYZE_WEBHOOK_URL:-}
      N8N_WEBHOOK_TOKEN: ${N8N_WEBHOOK_TOKEN:-}
      PAPER_INITIAL_BALANCE: ${PAPER_INITIAL_BALANCE:-1000}
      PAPER_SYMBOLS: ${PAPER_SYMBOLS:-BTC/USDT,ETH/USDT,SOL/USDT}
      PAPER_MAX_TRADE_PCT: ${PAPER_MAX_TRADE_PCT:-0.10}
      PAPER_MAX_EXPOSURE_PCT: ${PAPER_MAX_EXPOSURE_PCT:-0.70}
      PAPER_MAX_OPEN_TRADES: ${PAPER_MAX_OPEN_TRADES:-5}
      PAPER_FEE_RATE: ${PAPER_FEE_RATE:-0.001}
      PAPER_SLIPPAGE_RATE: ${PAPER_SLIPPAGE_RATE:-0.0005}
      PAPER_MAX_DRAWDOWN_PCT: ${PAPER_MAX_DRAWDOWN_PCT:-0.15}
      PAPER_OUTCOME_HORIZON_CANDLES: ${PAPER_OUTCOME_HORIZON_CANDLES:-12}
      PAPER_AUTO_ANALYZE: ${PAPER_AUTO_ANALYZE:-false}
      PAPER_AUTO_TIMEFRAME: ${PAPER_AUTO_TIMEFRAME:-5m}
      PAPER_AUTO_INTERVAL_MINUTES: ${PAPER_AUTO_INTERVAL_MINUTES:-5}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_trading_lab}
      POSTGRES_USER: ${POSTGRES_USER:-ai_trading_lab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in EasyPanel}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
